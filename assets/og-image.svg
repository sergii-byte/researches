<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15110d"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#b8593b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#b8593b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <text x="80" y="160" font-family="Inter, sans-serif" font-size="20" font-weight="600"
        letter-spacing="4" fill="#d97757" text-transform="uppercase">ПСИХОЛОГІЯ · РЕЗИЛЬЄНТНІСТЬ · ВОЛОНТЕРСТВО</text>

  <text x="80" y="280" font-family="Cormorant Garamond, Georgia, serif" font-weight="500"
        font-size="68" fill="#f4ecdf">Психологічні особливості</text>
  <text x="80" y="360" font-family="Cormorant Garamond, Georgia, serif" font-weight="500"
        font-size="68" fill="#f4ecdf">формування <tspan fill="#d97757" font-style="italic">резильєнтності</tspan></text>
  <text x="80" y="440" font-family="Cormorant Garamond, Georgia, serif" font-weight="500"
        font-size="68" fill="#f4ecdf">у волонтерів</text>

  <line x1="80" y1="490" x2="180" y2="490" stroke="#d97757" stroke-width="2"/>

  <text x="80" y="540" font-family="Inter, sans-serif" font-size="22" fill="#c8bca7">
    Дисертація · Барінов С. А. · Київ, 2026
  </text>
  <text x="80" y="572" font-family="Inter, sans-serif" font-size="18" fill="#8a7e6a">
    Інститут психології імені Г. С. Костюка НАПН України
  </text>
</svg>
